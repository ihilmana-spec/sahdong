
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tes Undangan SAHDONG</title>
</head>
<body style="font-family:Arial;padding:20px;max-width:500px;margin:auto">
  <h2>Tes Pembuatan Undangan</h2>

  <label>Judul Undangan</label>
  <input id="title" value="Undangan Tes Iman"
    style="width:100%;padding:12px;box-sizing:border-box">

  <br><br>

  <label>Kode Template</label>
  <input id="template" value="classic"
    style="width:100%;padding:12px;box-sizing:border-box">

  <br><br>

  <label>Tanggal Aktivasi</label>
  <input id="date" type="date" value="2026-12-20"
    style="width:100%;padding:12px;box-sizing:border-box">

  <br><br>

  <button id="submit" onclick="createInvitation()"
    style="padding:13px;width:100%">
    Buat Undangan Percobaan
  </button>

  <pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>

  <script>
    async function createInvitation() {
      const button = document.getElementById("submit");
      const result = document.getElementById("result");

      button.disabled = true;
      result.textContent = "Membuat undangan...";

      try {
        const response = await fetch("/api/invitations", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: document.getElementById("title").value,
            template_code: document.getElementById("template").value,
            activation_date: document.getElementById("date").value,
            invitation_data: {}
          })
        });

        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        result.textContent = "Kesalahan: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
