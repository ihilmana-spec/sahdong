
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <title>Login - SAHDONG</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #26362f;
      --ink-deep: #1d2d27;
      --gold: #b89a68;
      --gold-light: #d9c49c;
      --paper: #f7f3eb;
      --paper-deep: #eee8dc;
      --white: #fffdf9;
      --text: #4e554f;
      --muted: #85877f;
      --line: #e3dccf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top left, #fffdf9 0%, transparent 45%),
        linear-gradient(135deg, var(--paper), var(--paper-deep));
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 460px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .back-link:hover {
      color: var(--gold);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 44px 42px 36px;
      background: var(--white);
      border: 1px solid rgba(184,154,104,.28);
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(38,54,47,.09);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(
        90deg,
        var(--gold-light),
        var(--gold),
        var(--gold-light)
      );
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin-bottom: 13px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-family: "Playfair Display", serif;
      font-size: 23px;
    }

    .brand h1 {
      margin: 0;
      color: var(--ink);
      font-family: "Playfair Display", serif;
      font-size: 31px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .brand p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .heading {
      margin-bottom: 27px;
      text-align: center;
    }

    .heading h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-family: "Playfair Display", serif;
      font-size: 25px;
      font-weight: 600;
    }

    .heading p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: #fffefa;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184,154,104,.13);
    }

    input::placeholder {
      color: #aaa69d;
    }

    .password-input {
      padding-right: 76px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 5px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--gold);
    }

    .submit-button {
      width: 100%;
      min-height: 51px;
      margin-top: 9px;
      border: 0;
      border-radius: 9px;
      background: var(--ink-deep);
      color: white;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .submit-button:hover {
      background: #344b40;
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      display: none;
      margin-top: 17px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    #message.success {
      display: block;
      background: #edf5ee;
      color: #28633c;
    }

    #message.error {
      display: block;
      background: #fbefed;
      color: #a13d35;
    }

    .footer {
      margin-top: 25px;
      padding-top: 21px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--gold);
    }

    .copyright {
      margin-top: 22px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      letter-spacing: .3px;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 14px;
      }

      .card {
        padding: 35px 23px 29px;
        border-radius: 15px;
      }

      .brand h1 {
        font-size: 28px;
      }

      .heading h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a href="/" class="back-link">
      ← Kembali ke Beranda
    </a>

    <section class="card">
      <header class="brand">
        <div class="brand-mark">S</div>
        <h1>SAHDONG</h1>
        <p>Digital Wedding Invitation</p>
      </header>

      <div class="heading">
        <h2>Selamat Datang</h2>
        <p>Silakan masuk untuk mengelola undangan digital Anda.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input
            id="email"
            type="email"
            placeholder="nama@email.com"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              class="password-input"
              id="password"
              type="password"
              placeholder="Masukkan password"
              required
              autocomplete="current-password"
            >
            <button
              class="toggle-password"
              id="togglePassword"
              type="button"
              aria-label="Tampilkan password"
            >Lihat</button>
          </div>
        </div>

        <button id="submitButton" class="submit-button" type="submit">
          Masuk ke Akun
        </button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <div class="footer">
        Belum memiliki akun?
        <a href="/register.html">Buat Akun Sekarang</a>
      </div>
    </section>

    <div class="copyright">
      © 2026 Hilmana Design
    </div>
  </main>

  
<script>
  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const button = document.getElementById("submitButton");
  const passwordInput = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");

  // Menentukan halaman tujuan setelah login.
  function getRedirectUrl() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");

    if (!redirect || !redirect.startsWith("/") || redirect.startsWith("//")) {
      return "/dashboard.html";
    }

    try {
      const target = new URL(redirect, window.location.origin);

      if (target.origin !== window.location.origin) {
        return "/dashboard.html";
      }

      return target.pathname + target.search + target.hash;
    } catch {
      return "/dashboard.html";
    }
  }

  togglePassword.addEventListener("click", function() {
    const isHidden = passwordInput.type === "password";

    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "Sembunyikan" : "Lihat";
    togglePassword.setAttribute(
      "aria-label",
      isHidden ? "Sembunyikan password" : "Tampilkan password"
    );
  });

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.className = "";
    message.textContent = "";
    button.disabled = true;
    button.textContent = "Memproses...";

    const data = {
      email: document.getElementById("email").value.trim(),
      password: passwordInput.value
    };

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || "Login gagal.");
      }

      message.className = "success";
      message.textContent = "Login berhasil. Mengalihkan...";

      window.location.href = getRedirectUrl();

    } catch (error) {
      message.className = "error";
      message.textContent =
        error.message || "Tidak dapat menghubungi server.";

      button.disabled = false;
      button.textContent = "Masuk ke Akun";
    }
  });
</script>

</body>
</html>
