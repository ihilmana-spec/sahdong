
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tes Pembayaran SAHDONG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      padding: 20px;
    }
    main {
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      box-sizing: border-box;
    }
    button {
      background: #202b46;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 15px;
    }
    button:disabled {
      opacity: 0.6;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h2>SAHDONG - Tes API Pembayaran</h2>
    <p>Pengujian koneksi POST Cloudflare Pages</p>

    <button id="testButton" onclick="testPayment()">
      Tes Koneksi POST
    </button>

    <pre id="result"></pre>
  </main>

  <script>
    async function testPayment() {
      const button = document.getElementById("testButton");
      const result = document.getElementById("result");

      button.disabled = true;
      result.textContent = "Menghubungi server SAHDONG...";

      try {
        const response = await fetch("/api/payment/ping", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            test: true
          })
        });

        const raw = await response.text();

        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          result.textContent =
            "SERVER TIDAK MENGIRIM JSON\n\n" +
            "HTTP Status: " + response.status + "\n\n" +
            raw.substring(0, 5000);
          return;
        }

        result.textContent =
          "HTTP Status: " + response.status + "\n\n" +
          JSON.stringify(data, null, 2);

      } catch (error) {
        result.textContent =
          "Kesalahan koneksi: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
