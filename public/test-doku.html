
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAHDONG - Tes DOKU</title>
</head>
<body>
  <h2>SAHDONG - Tes API DOKU</h2>
  <button id="test">Jalankan Tes DOKU</button>
  <pre id="result">Belum diuji.</pre>

  <script>
    document.getElementById("test").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "Menghubungi DOKU...";

      try {
        const response = await fetch("/api/payment/doku-test", {
          method: "POST",
          credentials: "same-origin"
        });

        const raw = await response.text();

        try {
          result.textContent = JSON.stringify(
            JSON.parse(raw), null, 2
          );
        } catch {
          result.textContent =
            "HTTP " + response.status + "\n" + raw.slice(0, 3000);
        }
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
